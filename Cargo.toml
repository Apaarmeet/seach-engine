[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/crawler",
    "crates/indexer",
    "crates/signals",
    "crates/eval",
    "crates/places",
    "crates/api",
    "crates/cc-ingest",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
